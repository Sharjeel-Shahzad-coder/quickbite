<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickBite - Kitchen admin</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('qb_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="admin">
<header class="site-header"><div class="wrap nav">
<a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">Q</span>QuickBite</a>
<button class="icon-btn menu-toggle" id="menu-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="nav-links">&#9776;</button>
<nav class="links" id="nav-links" aria-label="Main"><a href="index.html" data-nav="home">Restaurants</a><a href="track.html" data-nav="track">Track order</a><a href="admin.html" data-nav="admin">Kitchen admin</a></nav>
<div class="nav-actions"><button class="icon-btn" id="theme-toggle" aria-label="Switch between light and dark theme">&#9680;</button>
<a class="cart-link" id="cart-link" href="cart.html" aria-label="Open cart">Cart <span class="badge" id="cart-count">0</span></a></div>
</div></header>
<main class="wrap">
  <h1>Kitchen admin</h1>
  <form id="login-form" class="card" style="max-width:420px">
    <label for="admin-key" style="margin-top:0">Admin key</label>
    <input id="admin-key" type="password" autocomplete="off">
    <div id="login-error" class="msg err hidden" role="alert"></div>
    <p style="margin-top:1rem"><button type="submit" class="btn" id="login-btn">Open dashboard</button></p>
  </form>
  <div id="dashboard" class="hidden">
    <div class="stats">
      <div class="card stat"><span class="meta">Total orders</span><b id="stat-orders">0</b></div>
      <div class="card stat"><span class="meta">Active orders</span><b id="stat-active">0</b></div>
      <div class="card stat"><span class="meta">Revenue</span><b id="stat-revenue">0</b></div>
    </div>
    <div class="admin-tools">
      <label class="sr-only" for="order-search">Search orders</label>
      <input id="order-search" type="search" placeholder="Search by name, phone or item" autocomplete="off">
      <div class="chips" id="status-filters" role="group" aria-label="Filter by status"></div>
      <span class="spacer"></span>
      <span class="meta" id="last-updated"></span>
      <label class="check-label"><input type="checkbox" id="auto-refresh" checked> Refresh every 10 s</label>
      <button type="button" class="btn secondary small" id="logout-btn">Log out</button>
    </div>
    <div class="card table-wrap">
      <table id="orders-table">
        <thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Placed</th><th>Status</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</main>
<footer>QuickBite &middot; served by <span id="host">...</span></footer>
<script src="js/app.js"></script>
</body>
</html>
